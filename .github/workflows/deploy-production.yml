name: Deploy Production
concurrency:
  group: production
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A push to main deploys only after the full suite is green.
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Required reviewer + branch restriction (main) are configured on this Environment.
    # It also holds PRODUCTION_KNOWN_HOSTS (variable). The CI SSH key comes from bws.
    environment: production
    env:
      DOCKER_BUILDKIT: 1
      PROD_HOST: 51.255.38.227
      PROD_USER: deploy
      KAMAL_VERSION: 2.10.1
      BWS_VERSION: 1.0.0
      BWS_ZIP_SHA256: 9077fb7b336a62abc8194728fea8753afad8b0baa3a18723fc05fc02fdb53568

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Install Bitwarden Secrets Manager CLI (pinned version + checksum)
      - name: Install Bitwarden Secrets Manager CLI
        shell: bash
        run: |
          curl -fsSL -o bws.zip \
            "https://github.com/bitwarden/sdk-sm/releases/download/bws-v${BWS_VERSION}/bws-x86_64-unknown-linux-gnu-${BWS_VERSION}.zip"
          echo "${BWS_ZIP_SHA256}  bws.zip" | sha256sum -c -
          unzip -o bws.zip bws
          chmod +x bws
          sudo mv bws /usr/local/bin/
          rm bws.zip
          bws --version

      # Fetch secrets from Bitwarden Secrets Manager. Every value is masked
      # before it is written to GITHUB_ENV; nothing is printed.
      - name: Get Secrets from Bitwarden
        shell: bash
        env:
          # bws reads this variable itself, no --access-token on the command line
          BWS_ACCESS_TOKEN: ${{ secrets.BW_ACCESS_TOKEN_PRODUCTION }}
          ID_REGISTRY_USERNAME: 196fa1de-77be-49ce-b56e-b50600d4ae49
          ID_REGISTRY_PASSWORD: 48c626f5-7997-4694-a7bf-b50600d44ca1
          ID_MASTER_KEY: 519419f3-6bb7-4ce6-8132-b3da0119bf76
          ID_POSTGRES_PASSWORD: 9c80203f-f8c2-4b5d-8d4b-b3da0119d394
          ID_REDIS_PASSWORD: 8ca74ff6-e6bd-4884-b45b-b3da0119f2a7
          # bws UUIDs are identifiers, not secrets; the access token is the only secret
          ID_APPSIGNAL: 10b644fb-ce8b-4d58-b0ac-b5050105f27e
          ID_STRAVA: e48a96fa-0e1a-42b9-9393-b505010605a2
          ID_HC_PING_KEY: d37a01b2-04bd-44d1-8f96-b5060154a055
        run: |
          command -v jq >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y jq; }

          fetch() {
            local name="$1" id="$2" value
            [[ -n "$id" ]] || { echo "❌ $name: secret id is not configured"; exit 1; }
            value=$(bws secret get "$id" | jq -r '.value')
            if [[ -z "$value" || "$value" == "null" || "$value" == *$'\n'* ]]; then
              echo "❌ $name missing or not a single-line value"; exit 1
            fi
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
            echo "✅ $name fetched"
          }

          fetch KAMAL_REGISTRY_USERNAME "$ID_REGISTRY_USERNAME"
          fetch KAMAL_REGISTRY_PASSWORD "$ID_REGISTRY_PASSWORD"
          fetch RAILS_MASTER_KEY        "$ID_MASTER_KEY"
          fetch POSTGRES_PASSWORD       "$ID_POSTGRES_PASSWORD"
          fetch REDIS_PASSWORD          "$ID_REDIS_PASSWORD"
          fetch APPSIGNAL_PUSH_API_KEY  "$ID_APPSIGNAL"
          fetch STRAVA_VERIFY_TOKEN     "$ID_STRAVA"
          fetch HC_PING_KEY             "$ID_HC_PING_KEY"

          echo "✅ All secrets fetched from Bitwarden Secrets Manager"

      - name: Set up Ruby
        uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
        with:
          ruby-version: '3.2.11'
          bundler-cache: false

      # Version matches Gemfile.lock
      - name: Install Kamal
        run: |
          gem install kamal --no-document -v "${KAMAL_VERSION}"
          kamal version

      - name: Set up SSH
        shell: bash
        env:
          # CI deploy key lives in bws (kw-app-production-ci-deploy-ssh-key)
          BWS_ACCESS_TOKEN: ${{ secrets.BW_ACCESS_TOKEN_PRODUCTION }}
          ID_CI_SSH_KEY: 5bc97855-9316-4444-82b9-b50600cc135b
          SSH_KNOWN_HOSTS: ${{ vars.PRODUCTION_KNOWN_HOSTS }}
        run: |
          [[ -n "$SSH_KNOWN_HOSTS" ]] || { echo "❌ PRODUCTION_KNOWN_HOSTS (Environment variable) is not set"; exit 1; }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          umask 077
          bws secret get "$ID_CI_SSH_KEY" | jq -r '.value' > ~/.ssh/kamal_production_ed25519 \
            || { echo "❌ could not fetch the CI SSH key from bws"; exit 1; }
          chmod 600 ~/.ssh/kamal_production_ed25519
          ssh-keygen -y -f ~/.ssh/kamal_production_ed25519 > /dev/null 2>&1 \
            || { echo "❌ SSH private key is not valid"; exit 1; }

          # Host key is pinned from the Environment (no ssh-keyscan)
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          grep -q "^${PROD_HOST} " ~/.ssh/known_hosts \
            || { echo "❌ PRODUCTION_KNOWN_HOSTS has no entry for ${PROD_HOST}"; exit 1; }

          {
            echo "Host ${PROD_HOST}"
            echo "  User ${PROD_USER}"
            echo "  IdentityFile ~/.ssh/kamal_production_ed25519"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
            echo "  IdentitiesOnly yes"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

          echo "✅ SSH key validated, host key pinned, SSH config written"

      - name: Start SSH agent and add key
        run: |
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/kamal_production_ed25519
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          echo "✅ SSH agent started and key added"

      - name: Test SSH connection
        run: |
          if ssh -o ConnectTimeout=10 -o BatchMode=yes "${PROD_USER}@${PROD_HOST}" 'echo "✅ SSH connection successful"'; then
            echo "SSH authentication working correctly"
          else
            echo "❌ SSH connection failed. Check:"
            echo "  1. bws secret kw-app-production-ci-deploy-ssh-key (CI key)"
            echo "  2. the matching public key in /home/${PROD_USER}/.ssh/authorized_keys on the server"
            echo "  3. Environment variable PRODUCTION_KNOWN_HOSTS (host key changed?)"
            exit 1
          fi

      - name: Login to Docker Hub
        run: |
          printf '%s' "$KAMAL_REGISTRY_PASSWORD" | docker login -u "$KAMAL_REGISTRY_USERNAME" --password-stdin

      - name: Release deploy lock
        run: kamal lock release -d production || true

      - name: Deploy to production
        run: kamal deploy -d production

      - name: Cleanup old Docker images
        run: kamal prune all -d production || true
        continue-on-error: true
