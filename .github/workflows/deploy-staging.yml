name: Deploy Staging
concurrency:
  group: staging
  cancel-in-progress: true

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Linux, ARM64]
    env:
      DOCKER_BUILDKIT: 1

    steps:
      - uses: actions/checkout@v4
      
      # Install Bitwarden Secrets Manager CLI
      - name: Install Bitwarden Secrets Manager CLI
        run: |
          if ! command -v bws &> /dev/null; then
            echo "Installing Bitwarden Secrets Manager CLI v1.0.0..."
            
            # Download ARM64 binary for v1.0.0
            curl -L -o bws-aarch64-unknown-linux-gnu.zip \
              "https://github.com/bitwarden/sdk-sm/releases/download/bws-v1.0.0/bws-aarch64-unknown-linux-gnu-1.0.0.zip"
            
            unzip -o bws-aarch64-unknown-linux-gnu.zip
            chmod +x bws
            sudo mv bws /usr/local/bin/
            rm bws-aarch64-unknown-linux-gnu.zip
          else
            echo "✅ Bitwarden Secrets Manager CLI already installed"
          fi
          
          bws --version
      
      # Fetch secrets from Bitwarden Secrets Manager. Every value is masked
      # BEFORE it is written to GITHUB_ENV (GitHub prints the env of every later
      # step, so an unmasked value ends up in the public run log).
      - name: Get Secrets from Bitwarden
        shell: bash
        env:
          # bws reads this variable itself, no --access-token on the command line
          BWS_ACCESS_TOKEN: ${{ secrets.BW_ACCESS_TOKEN }}
          # bws UUIDs are identifiers, not secrets; the access token is the only secret
          ID_REGISTRY_USERNAME: 196fa1de-77be-49ce-b56e-b50600d4ae49
          ID_REGISTRY_PASSWORD: 48c626f5-7997-4694-a7bf-b50600d44ca1
          ID_MASTER_KEY: 79cdec0b-a73e-4f31-aabe-b3da0110963a
          ID_POSTGRES_PASSWORD: 5f418769-a3ee-46d3-87bf-b3da0110cd71
          ID_REDIS_PASSWORD: b4b3b0ce-46fe-4068-a477-b3da0110f721
          ID_APPSIGNAL: 10b644fb-ce8b-4d58-b0ac-b5050105f27e
          ID_STRAVA: e48a96fa-0e1a-42b9-9393-b505010605a2
        run: |
          command -v jq >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y jq; }

          fetch() {
            local name="$1" id="$2" value
            value=$(bws secret get "$id" | jq -r '.value')
            if [[ -z "$value" || "$value" == "null" || "$value" == *$'\n'* ]]; then
              echo "❌ $name missing or not a single-line value"; exit 1
            fi
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
            echo "✅ $name fetched"
          }

          fetch KAMAL_REGISTRY_USERNAME "$ID_REGISTRY_USERNAME"
          fetch KAMAL_REGISTRY_PASSWORD "$ID_REGISTRY_PASSWORD"
          fetch RAILS_MASTER_KEY        "$ID_MASTER_KEY"
          fetch POSTGRES_PASSWORD       "$ID_POSTGRES_PASSWORD"
          fetch REDIS_PASSWORD          "$ID_REDIS_PASSWORD"
          fetch APPSIGNAL_PUSH_API_KEY  "$ID_APPSIGNAL"
          fetch STRAVA_VERIFY_TOKEN     "$ID_STRAVA"

          echo "✅ All secrets fetched successfully from Bitwarden Secrets Manager!"
      
      - name: Install jq
        run: |
          if ! command -v jq &> /dev/null; then
            echo "Installing jq..."
            sudo apt-get update -qq
            sudo apt-get install -y jq
          else
            echo "✅ jq already installed"
          fi
      
      - name: Configure hostname resolution
        run: |
          # Map pi5main.local to localhost for runner container
          echo "127.0.0.1 pi5main.local" | sudo tee -a /etc/hosts
          echo "✅ Added pi5main.local to /etc/hosts"
      
      - name: Set up Ruby 3.2.11 with ruby-build
        run: |
          RUBY_VERSION="3.2.11"
          RUBY_INSTALL_DIR="/opt/hostedtoolcache/Ruby/${RUBY_VERSION}/arm64"
          
          # Check if Ruby is already installed in tool cache
          if [ -f "${RUBY_INSTALL_DIR}.complete" ]; then
            echo "✅ Ruby ${RUBY_VERSION} already installed in tool cache"
          else
            echo "Installing Ruby ${RUBY_VERSION} to tool cache..."
            
            # Install ruby-build if not present
            if ! command -v ruby-build &> /dev/null; then
              echo "Installing ruby-build..."
              git clone https://github.com/rbenv/ruby-build.git /tmp/ruby-build
              sudo /tmp/ruby-build/install.sh
              rm -rf /tmp/ruby-build
            fi
            
            # Install build dependencies
            sudo apt-get update -qq
            sudo apt-get install -y build-essential libssl-dev libreadline-dev zlib1g-dev
            
            # Create tool cache directory
            sudo mkdir -p /opt/hostedtoolcache/Ruby
            sudo chown -R $USER:$USER /opt/hostedtoolcache
            
            # Build Ruby
            ruby-build ${RUBY_VERSION} ${RUBY_INSTALL_DIR}
            
            # Mark as complete
            touch ${RUBY_INSTALL_DIR}.complete
            
            echo "✅ Ruby ${RUBY_VERSION} installed successfully"
          fi
          
          # Add Ruby to PATH
          echo "${RUBY_INSTALL_DIR}/bin" >> $GITHUB_PATH
          
          # Verify installation
          ${RUBY_INSTALL_DIR}/bin/ruby -v
      
      - name: Install Kamal
        run: |
          if ! command -v kamal &> /dev/null; then
            gem install kamal --no-document
          fi
          kamal version
      
      - name: Set up SSH for deployment
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Generate SSH key if not exists
          if [ ! -f ~/.ssh/id_ed25519 ]; then
            ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N "" -C "github-actions-runner"
            echo "✅ Generated new SSH key"
          else
            echo "✅ SSH key already exists"
          fi
          
          # Add runner's public key to host's authorized_keys using Docker volume mount
          # This allows the runner container to SSH to the host as user 'rege'
          echo "Adding SSH key to host..."
          docker run --rm -v /home:/hosthome alpine sh -c "
            mkdir -p /hosthome/rege/.ssh
            chmod 700 /hosthome/rege/.ssh
            grep -qF '$(cat ~/.ssh/id_ed25519.pub)' /hosthome/rege/.ssh/authorized_keys 2>/dev/null || echo '$(cat ~/.ssh/id_ed25519.pub)' >> /hosthome/rege/.ssh/authorized_keys
            chmod 600 /hosthome/rege/.ssh/authorized_keys
          "
          echo "✅ SSH key added to host"
          
          # Configure SSH client
          cat > ~/.ssh/config << 'EOF'
          Host pi5main.local localhost 127.0.0.1
            User rege
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config
          
          echo "✅ SSH configured"
      
      - name: Login to Docker Hub
        run: |
          echo "${{ env.KAMAL_REGISTRY_PASSWORD }}" | docker login -u "${{ env.KAMAL_REGISTRY_USERNAME }}" --password-stdin
      
      - name: Release deploy lock
        run: kamal lock release -d staging || true
      
      - name: Boot accessories (postgres and redis)
        run: |
          kamal accessory boot postgres -d staging || echo "Postgres already running"
          kamal accessory boot redis -d staging || echo "Redis already running"
      
      - name: Deploy to staging
        run: kamal deploy -d staging
      
      - name: Cleanup old Docker images
        run: kamal prune all -d staging || true
        continue-on-error: true