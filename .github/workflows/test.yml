name: Test Suite

on:
  push:
    branches:
      - develop
  # PRs to main run the same check (required status check `test`); a push to main
  # runs it through deploy-production.yml (workflow_call), so main is not in `push`.
  pull_request:
    branches:
      - develop
      - main
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:10.3-alpine
        env:
          POSTGRES_USER: dev-user
          POSTGRES_PASSWORD: dev-password
          POSTGRES_DB: kw_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_USER: dev-user
      DB_PASSWORD: dev-password
      REDIS_URL_SIDEKIQ: redis://localhost:6379/1
      USE_LOCAL_STORAGE: 'true'
      # ubuntu-latest (26.04) ships GCC 15 (default C23): appsignal 4.3.1's C extension does not compile with it.
      BUNDLE_BUILD__APPSIGNAL: '--with-cflags=-std=gnu17'

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Ruby
        uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
        with:
          ruby-version: '3.2.11'
          bundler-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpq-dev

      - name: Setup test database
        run: |
          bundle exec rake db:create
          bundle exec rake db:schema:load

      - name: Run RSpec tests
        run: |
          bundle exec rspec --format documentation --format progress

      - name: Test Summary
        if: always()
        run: |
          echo "✅ Test suite execution completed"
          echo "Check the logs above for detailed results"