# Production-specific configuration overrides

servers:
  web:
    hosts:
      - 146.59.44.70

# Allow enough time for migrations and deployment (default is 30s)
deploy_timeout: 300

proxy:
  ssl: true
  host: nowypanel.kw.krakow.pl

env:
  clear:
    RAILS_ENV: production
    RACK_ENV: production
    ASSET_HOST: https://nowypanel.kw.krakow.pl
    POSTGRES_USER: production_user
    POSTGRES_DB: kw_app_production
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
    - APPSIGNAL_PUSH_API_KEY
    - STRAVA_VERIFY_TOKEN

ssh:
  user: ubuntu

accessories:
  postgres:
    image: postgres:16.0
    host: 146.59.44.70
    port: "127.0.0.1:5432:5432"
    cmd: postgres
    options:
      network: "kw-app-network"
    env:
      clear:
        POSTGRES_USER: production_user
        POSTGRES_DB: kw_app_production
      secret:
        - POSTGRES_PASSWORD
    files:
      - config/init.sql:/docker-entrypoint-initdb.d/setup.sql
    directories:
      - data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    host: 146.59.44.70
    port: "127.0.0.1:6379:6379"
    options:
      network: "kw-app-network"
    env:
      secret:
        - REDIS_PASSWORD
    cmd: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --dir /data'
    directories:
      - redis-data:/data