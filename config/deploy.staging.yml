# Staging-specific configuration overrides

service: kw-app-staging

builder:
  arch: arm64

servers:
  web:
    hosts:
      - pi5main.local
  job:
    hosts:
      - pi5main.local
    cmd: bundle exec sidekiq -C config/sidekiq.yml
    options:
      network: "kw-app-network"

deploy_timeout: 180

proxy:
  ssl: false
  host: panel.taterniczek.pl
  healthcheck:
    path: /up
    interval: 2
    timeout: 5

env:
  clear:
    RAILS_ENV: staging
    RACK_ENV: staging
    DB_HOST: kw-app-staging-postgres
    RAILS_SERVE_STATIC_FILES: true
    ASSET_HOST: http://panel.taterniczek.pl
    REDIS_URL_SIDEKIQ: redis://kw-app-staging-redis:6379/1
  secret:
    - RAILS_MASTER_KEY
    - APPSIGNAL_PUSH_API_KEY
    - STRAVA_VERIFY_TOKEN
    - REDIS_PASSWORD

ssh:
  user: rege

accessories:
  postgres:
    service: kw-app-staging-postgres
    image: postgres:16.0
    host: pi5main.local
    port: "5433:5432"
    options:
      network: "kw-app-network"
    env:
      clear:
        POSTGRES_USER: staging_user
        POSTGRES_DB: kw_app_staging
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data-staging:/var/lib/postgresql/data

  redis:
    service: kw-app-staging-redis
    image: redis:7-alpine
    host: pi5main.local
    port: "6381:6379"
    options:
      network: "kw-app-network"
    env:
      secret:
        - REDIS_PASSWORD
    cmd: sh -c 'redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --dir /data'
    directories:
      - redis-data-staging:/data