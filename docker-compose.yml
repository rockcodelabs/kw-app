services:
  app:
    command: ./bin/thrust ./bin/rails server -p 3002 -b 0.0.0.0
    build: .
    environment:
      - DB_HOST=postgres
      - DB_USER=dev-user
      - DB_PASSWORD=dev-password
      - REDIS_URL_SIDEKIQ=redis://redis:6379/1
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - .:/rails
      - kw-app-bundle:/usr/local/bundle
      - kw-app-tmp:/rails/tmp
    ports:
      - "3002:3002"
    depends_on:
      - postgres
      - redis
      - mailcatcher
    tty: true
    stdin_open: true
    networks:
      - kw-app-network

  postgres:
    container_name: kw-app-postgres-10
    image: 'postgres:10.3-alpine'
    volumes:
      - kw-app-postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=dev-user
      - POSTGRES_PASSWORD=dev-password
    ports:
        - "5433:5432"
    networks:
      - kw-app-network

  sidekiq:
    container_name: kw-app-sidekiq
    depends_on:
      - postgres
      - redis
    build: .
    command: ./bin/sidekiq -C config/sidekiq.yml
    volumes:
      - .:/rails
      - kw-app-bundle:/usr/local/bundle
      - kw-app-tmp:/rails/tmp
    environment:
      - DB_HOST=postgres
      - DB_USER=dev-user
      - DB_PASSWORD=dev-password
      - REDIS_URL_SIDEKIQ=redis://redis:6379/1
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    stdin_open: true
    tty: true
    networks:
      - kw-app-network

  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1025:1025"
      - "1080:1080"
    networks:
      - kw-app-network

  redis:
    container_name: kw-app-redis
    image: 'redis:7-alpine'
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - '6380:6379'
    volumes:
      - kw-app-redis-data:/var/lib/redis/data
    sysctls:
      - net.core.somaxconn=4096
    networks:
      - kw-app-network

  playwright:
    container_name: kw-app-playwright
    image: mcr.microsoft.com/playwright:v1.57.0-noble
    command: /bin/sh -c "npx -y playwright@1.57.0 run-server --port 8080 --host 0.0.0.0"
    ports:
      - '8080:8080'
    networks:
      - kw-app-network
    init: true
    ipc: host
    user: pwuser
    working_dir: /home/pwuser

volumes:
  kw-app-redis-data:
  kw-app-postgres:
  kw-app-bundle:
  kw-app-tmp:

networks:
  kw-app-network:
    name: kw-app-network